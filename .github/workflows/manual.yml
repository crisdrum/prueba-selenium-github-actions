name: Regresion Manual Prueba

on:
  workflow_dispatch: # Esto activa el botón

jobs:
  test-job:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Install Dependencies
        run: dotnet restore
        
      - name: Run Selenium Test
        # Agregamos un "Logger" para que cree el archivo TRX
        run: dotnet test --configuration Release --logger "trx;LogFileName=regresion_resultados.trx"
        
      - name: Descargar para revisar localmente
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Regresion
          path: "**/TestResults/regresion_resultados.trx"
